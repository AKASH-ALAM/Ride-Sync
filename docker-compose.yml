services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: ridesync-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RideSync_Pass123!"
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
  redis:
    image: redis:7
    container_name: ridesync-redis
    ports: ["6379:6379"]
volumes:
  sqldata:
